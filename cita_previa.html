<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Citas Previas - Talleres A.Q.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        aqRed: {
                            DEFAULT: '#FF3D00',
                            dark: '#D32F2F',
                            glow: 'rgba(255, 61, 0, 0.25)'
                        },
                        darkSlate: '#0D1117',
                        cardSlate: '#161B22',
                        inputSlate: '#21262D',
                        waGreen: {
                            DEFAULT: '#25D366',
                            hover: '#1eb954',
                            dark: '#128C7E'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0D1117;
            color: #F0F6FC;
            -webkit-tap-highlight-color: transparent;
        }

        /* Prevent auto-zoom on iOS when tapping inputs */
        input, select, textarea {
            font-size: 16px !important;
        }

        /* Glassmorphism elements */
        .glass-card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .input-mobile {
            background-color: #21262D;
            border: 1.5px solid #30363D;
            color: #F0F6FC;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 48px;
        }

        .input-mobile:focus {
            border-color: #FF3D00;
            background-color: #161B22;
            box-shadow: 0 0 0 3px rgba(255, 61, 0, 0.2);
            outline: none;
        }

        /* Custom Touch Buttons/Chips */
        .chip-button {
            min-height: 44px;
            touch-action: manipulation;
            transition: all 0.2s ease;
            border: 1.5px solid #30363D;
            background-color: #21262D;
            color: #C9D1D9;
        }

        .chip-button.active {
            background-color: #FF3D00;
            border-color: #FF3D00;
            color: #FFFFFF;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(255, 61, 0, 0.4);
        }

        .service-chip {
            min-height: 46px;
            transition: all 0.2s ease;
            border: 1.5px solid #30363D;
            background-color: #21262D;
            color: #C9D1D9;
        }

        .service-chip.active {
            background-color: #30363D;
            border-color: #FF3D00;
            color: #FFFFFF;
            font-weight: 700;
            box-shadow: inset 0 0 0 1px #FF3D00;
        }

        /* Custom Scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Mobile Bottom Sheet Drawer Animation */
        .sheet-transition {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="min-h-full pb-28 pt-4 px-3 sm:px-6 md:py-8">

<div class="max-w-2xl mx-auto space-y-4">

    <!-- Header Section -->
    <header class="glass-card rounded-2xl p-4 sm:p-5 flex items-center justify-between border-l-4 border-l-aqRed">
        <div class="flex items-center space-x-3.5">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-aqRed to-aqRed-dark flex items-center justify-center shadow-lg shadow-aqRed/30 shrink-0">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white flex items-center gap-1.5">
                    TALLERES A.Q.
                </h1>
                <p class="text-xs font-semibold text-aqRed tracking-wider uppercase">Gestión de Citas previas</p>
            </div>
        </div>
        <button type="button" onclick="resetForm()" class="p-2.5 rounded-xl bg-inputSlate text-slate-400 hover:text-white active:scale-95 transition-all text-xs font-medium flex items-center gap-1.5 border border-slate-700/50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            <span class="hidden sm:inline">Limpiar</span>
        </button>
    </header>

    <form id="formCita" class="space-y-4" onsubmit="event.preventDefault();">

        <!-- 1. Teléfono WhatsApp -->
        <div class="glass-panel p-4 sm:p-5 rounded-2xl space-y-3">
            <label class="flex items-center text-xs font-bold uppercase tracking-wider text-slate-300 gap-2">
                <span class="w-2 h-2 rounded-full bg-aqRed"></span>
                1. WhatsApp Destinatario (Cliente) <span class="text-aqRed">*</span>
            </label>
            <div class="flex gap-2">
                <div class="w-28 shrink-0">
                    <select id="prefijoPais" class="w-full input-mobile rounded-xl px-2.5 font-semibold text-white">
                        <option value="34" selected>🇪🇸 +34</option>
                        <option value="351">🇵🇹 +351</option>
                        <option value="33">🇫🇷 +33</option>
                        <option value="49">🇩🇪 +49</option>
                        <option value="39">🇮🇹 +39</option>
                        <option value="44">🇬🇧 +44</option>
                        <option value="1">🇺🇸 +1</option>
                    </select>
                </div>
                <div class="flex-1">
                    <input type="tel" id="telefonoWhatsapp" placeholder="600 12 34 56" required class="w-full input-mobile rounded-xl px-4 font-bold tracking-wide placeholder-slate-500">
                </div>
            </div>
        </div>

        <!-- 2. Cliente y Vehículo -->
        <div class="glass-panel p-4 sm:p-5 rounded-2xl space-y-4">
            <label class="flex items-center text-xs font-bold uppercase tracking-wider text-slate-300 gap-2">
                <span class="w-2 h-2 rounded-full bg-aqRed"></span>
                2. Cliente y Vehículo
            </label>

            <div>
                <label for="nombreCliente" class="block text-xs font-medium text-slate-400 mb-1">Nombre del Cliente <span class="text-aqRed">*</span></label>
                <input type="text" id="nombreCliente" placeholder="Ej: JUAN PÉREZ" required class="w-full input-mobile rounded-xl px-4 font-semibold uppercase placeholder-slate-600" oninput="this.value = this.value.toUpperCase()">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label for="matricula" class="block text-xs font-medium text-slate-400 mb-1">Matrícula <span class="text-aqRed">*</span></label>
                    <input type="text" id="matricula" placeholder="1234 ABC" required class="w-full input-mobile rounded-xl px-4 font-bold tracking-wider uppercase placeholder-slate-600" oninput="this.value = this.value.toUpperCase()">
                </div>
                <div>
                    <label for="marcaModelo" class="block text-xs font-medium text-slate-400 mb-1">Marca y Modelo</label>
                    <input type="text" id="marcaModelo" placeholder="Ej: SEAT LEÓN" class="w-full input-mobile rounded-xl px-4 font-semibold uppercase placeholder-slate-600" oninput="this.value = this.value.toUpperCase()">
                </div>
            </div>
        </div>

        <!-- 3. Fecha y Hora -->
        <div class="glass-panel p-4 sm:p-5 rounded-2xl space-y-4">
            <label class="flex items-center text-xs font-bold uppercase tracking-wider text-slate-300 gap-2">
                <span class="w-2 h-2 rounded-full bg-aqRed"></span>
                3. Fecha y Hora de la Cita <span class="text-aqRed">*</span>
            </label>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label for="fechaCita" class="block text-xs font-medium text-slate-400 mb-1">Fecha</label>
                    <input type="date" id="fechaCita" required class="w-full input-mobile rounded-xl px-4 font-semibold text-white">
                </div>
                <div>
                    <label for="horaCita" class="block text-xs font-medium text-slate-400 mb-1">Hora Exacta</label>
                    <input type="time" id="horaCita" required class="w-full input-mobile rounded-xl px-4 font-semibold text-white">
                </div>
            </div>

            <!-- Quick Time Selection Pills -->
            <div>
                <span class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Horas Frecuentes Taller</span>
                <div class="grid grid-cols-5 gap-1.5">
                    <button type="button" onclick="setQuickTime('08:30', this)" class="chip-button rounded-xl text-xs font-bold flex items-center justify-center">08:30</button>
                    <button type="button" onclick="setQuickTime('09:30', this)" class="chip-button rounded-xl text-xs font-bold flex items-center justify-center">09:30</button>
                    <button type="button" onclick="setQuickTime('11:00', this)" class="chip-button rounded-xl text-xs font-bold flex items-center justify-center">11:00</button>
                    <button type="button" onclick="setQuickTime('16:00', this)" class="chip-button rounded-xl text-xs font-bold flex items-center justify-center">16:00</button>
                    <button type="button" onclick="setQuickTime('17:30', this)" class="chip-button rounded-xl text-xs font-bold flex items-center justify-center">17:30</button>
                </div>
            </div>
        </div>

        <!-- 4. Motivo / Servicio -->
        <div class="glass-panel p-4 sm:p-5 rounded-2xl space-y-4">
            <label class="flex items-center text-xs font-bold uppercase tracking-wider text-slate-300 gap-2">
                <span class="w-2 h-2 rounded-full bg-aqRed"></span>
                4. Motivo del Trabajo
            </label>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                <button type="button" onclick="selectService('REVISIÓN / MANTENIMIENTO', this)" class="service-chip active rounded-xl text-xs font-semibold px-3 py-2 text-center">🛢️ Mantenimiento</button>
                <button type="button" onclick="selectService('REVISIÓN PRE-ITV', this)" class="service-chip rounded-xl text-xs font-semibold px-3 py-2 text-center">📋 Pre-ITV</button>
                <button type="button" onclick="selectService('DIAGNÓSTICO / AVERÍA', this)" class="service-chip rounded-xl text-xs font-semibold px-3 py-2 text-center">🔍 Avería / Check</button>
                <button type="button" onclick="selectService('CAMBIO NEUMÁTICOS', this)" class="service-chip rounded-xl text-xs font-semibold px-3 py-2 text-center">🛞 Neumáticos</button>
                <button type="button" onclick="selectService('FRENOS / DISTRIBUCIÓN', this)" class="service-chip rounded-xl text-xs font-semibold px-3 py-2 text-center">⚙️ Frenos / Motor</button>
                <button type="button" onclick="selectService('OTRO TRABAJO', this)" class="service-chip rounded-xl text-xs font-semibold px-3 py-2 text-center">🔧 Otro Servicio</button>
            </div>

            <div>
                <input type="text" id="motivoPersonalizado" placeholder="O especifique el detalle del trabajo..." class="w-full input-mobile rounded-xl px-4 font-semibold uppercase text-xs sm:text-sm placeholder-slate-600" oninput="this.value = this.value.toUpperCase()">
            </div>

            <div>
                <label for="observaciones" class="block text-xs font-medium text-slate-400 mb-1">Notas / Recordatorios Extra (Opcional)</label>
                <textarea id="observaciones" rows="2" placeholder="Ej: Dejar llaves antirrobo, traer permiso de circulación..." class="w-full input-mobile rounded-xl p-3 font-semibold uppercase text-xs sm:text-sm placeholder-slate-600" oninput="this.value = this.value.toUpperCase()"></textarea>
            </div>
        </div>

    </form>
</div>

<!-- Floating Bottom WhatsApp Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-3 sm:p-4 bg-darkSlate/95 backdrop-blur-xl border-t border-slate-800/80 z-40">
    <div class="max-w-2xl mx-auto flex items-center gap-2">
        
        <!-- Toggle Preview Button -->
        <button type="button" onclick="togglePreviewSheet()" class="p-3.5 rounded-2xl bg-inputSlate hover:bg-slate-700 text-slate-300 active:scale-95 transition-all relative border border-slate-700/60 shrink-0" title="Ver Vista Previa">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
            <span class="absolute -top-1 -right-1 w-3 h-3 bg-aqRed rounded-full"></span>
        </button>

        <!-- Send WhatsApp Direct Button -->
        <button type="button" onclick="sendWhatsAppMessage()" class="flex-1 py-3.5 px-5 bg-waGreen hover:bg-waGreen-hover active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-waGreen/25 flex items-center justify-center gap-2.5 text-base sm:text-lg transition-all duration-200">
            <svg class="w-6 h-6 fill-current shrink-0" viewBox="0 0 24 24">
                <path d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984 0 1.763.459 3.483 1.332 5.001L2 22l5.127-1.338c1.46.797 3.109 1.216 4.885 1.217h.004c5.504 0 9.988-4.478 9.989-9.985 0-2.667-1.037-5.176-2.922-7.062A9.925 9.925 0 0 0 12.012 2zM12.01 20.19h-.003c-1.493 0-2.957-.401-4.233-1.157l-.304-.18-3.146.822.839-3.064-.198-.315a8.318 8.318 0 0 1-1.272-4.312c.001-4.58 3.73-8.307 8.312-8.307 2.219 0 4.305.865 5.871 2.433a8.27 8.27 0 0 1 2.43 5.875c-.002 4.582-3.731 8.308-8.296 8.308zm4.553-6.213c-.25-.125-1.477-.728-1.706-.811-.229-.083-.396-.125-.562.125-.166.25-.646.811-.791.978-.146.166-.292.187-.542.062a6.852 6.852 0 0 1-2.012-1.239 7.55 7.55 0 0 1-1.393-1.731c-.146-.25-.015-.385.11-.509.112-.112.25-.292.375-.438.125-.145.166-.25.25-.416.083-.166.042-.312-.021-.437-.062-.125-.562-1.353-.77-1.853-.203-.487-.41-.421-.562-.428l-.48-.008c-.166 0-.437.062-.666.312-.229.25-.875.854-.875 2.083 0 1.229.896 2.416 1.021 2.583.125.166 1.764 2.695 4.275 3.777.597.257 1.064.411 1.428.526.6.19 1.147.163 1.579.099.482-.071 1.477-.604 1.686-1.187.208-.583.208-1.083.146-1.187-.062-.104-.229-.166-.479-.291z"/>
            </svg>
            <span class="truncate">ENVIAR POR WHATSAPP</span>
        </button>

    </div>
</div>

<!-- Mobile Drawer Modal for Live WhatsApp Preview -->
<div id="previewBackdrop" onclick="togglePreviewSheet()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>

<div id="previewSheet" class="fixed bottom-0 left-0 right-0 bg-cardSlate border-t border-slate-700/80 rounded-t-3xl p-5 z-50 transform translate-y-full sheet-transition max-w-2xl mx-auto shadow-2xl">
    <div class="w-12 h-1.5 bg-slate-600 rounded-full mx-auto mb-4"></div>
    
    <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-waGreen animate-pulse"></span>
            Vista previa del mensaje
        </h3>
        <button type="button" onclick="copyMessageText()" class="text-xs bg-inputSlate hover:bg-slate-700 text-slate-300 font-semibold px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1 active:scale-95 transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
            Copiar
        </button>
    </div>

    <div id="previewText" class="bg-inputSlate/90 border border-slate-700 rounded-2xl p-4 text-xs sm:text-sm text-slate-200 font-mono leading-relaxed whitespace-pre-wrap max-h-[60vh] overflow-y-auto">
        <!-- Live preview content populated via JavaScript -->
    </div>

    <div class="mt-4 flex gap-2">
        <button type="button" onclick="togglePreviewSheet()" class="w-1/3 py-3 rounded-xl bg-inputSlate text-slate-300 font-semibold text-xs border border-slate-700">
            Cerrar
        </button>
        <button type="button" onclick="sendWhatsAppMessage()" class="w-2/3 py-3 rounded-xl bg-waGreen text-white font-bold text-xs flex items-center justify-center gap-2">
            Confirmar y Enviar
        </button>
    </div>
</div>

<!-- Notification Toast -->
<div id="toastMessage" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl text-xs font-bold text-white shadow-xl opacity-0 pointer-events-none transition-all duration-300"></div>

<script>
    let selectedService = 'REVISIÓN / MANTENIMIENTO';
    let isSheetOpen = false;

    document.addEventListener('DOMContentLoaded', () => {
        // Set Default Date to Today and Time to 09:00
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('fechaCita').value = today;
        document.getElementById('horaCita').value = '09:00';

        // Auto-format phone input (detect Spanish 9-digit input)
        const phoneInput = document.getElementById('telefonoWhatsapp');
        phoneInput.addEventListener('input', (e) => {
            let cleaned = e.target.value.replace(/\D/g, '');
            e.target.value = cleaned;
            updatePreview();
        });

        // Event listeners for real-time preview updates
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.addEventListener('input', updatePreview);
            input.addEventListener('change', updatePreview);
        });

        updatePreview();
    });

    function setQuickTime(time, btn) {
        document.getElementById('horaCita').value = time;
        document.querySelectorAll('.chip-button').forEach(c => c.classList.remove('active'));
        if (btn) btn.classList.add('active');
        updatePreview();
    }

    function selectService(serviceName, btn) {
        selectedService = serviceName;
        document.getElementById('motivoPersonalizado').value = '';
        
        document.querySelectorAll('.service-chip').forEach(c => c.classList.remove('active'));
        if (btn) btn.classList.add('active');

        updatePreview();
    }

    function formatDate(dateStr) {
        if (!dateStr) return 'DD/MM/AAAA';
        const parts = dateStr.split('-');
        if (parts.length === 3) {
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return dateStr;
    }

    function generateMessageText() {
        const nombre = (document.getElementById('nombreCliente').value || 'ESTIMADO/A CLIENTE').trim();
        const matricula = (document.getElementById('matricula').value || '---').toUpperCase().trim();
        const marcaModelo = (document.getElementById('marcaModelo').value || '').toUpperCase().trim();
        const fechaRaw = document.getElementById('fechaCita').value;
        const fechaFormatted = formatDate(fechaRaw);
        const hora = document.getElementById('horaCita').value || '--:--';
        
        const motivoCustom = document.getElementById('motivoPersonalizado').value.toUpperCase().trim();
        const motivoFinal = motivoCustom || selectedService;
        const observaciones = document.getElementById('observaciones').value.toUpperCase().trim();

        let vehiculoInfo = matricula;
        if (marcaModelo) {
            vehiculoInfo += ` (${marcaModelo})`;
        }

        let mensaje = `🚗 *TALLERES A.Q. - CITA PREVIA*\n\n` +
            `Hola *${nombre}*,\n` +
            `Le confirmamos la reserva de su cita en nuestro taller:\n\n` +
            `📅 *Fecha:* ${fechaFormatted}\n` +
            `⏰ *Hora:* ${hora} h\n` +
            `🚙 *Vehículo:* ${vehiculoInfo}\n` +
            `🛠️ *Servicio:* ${motivoFinal}\n`;

        if (observaciones) {
            mensaje += `\n📌 *Notas:* ${observaciones}\n`;
        } else {
            mensaje += `\n📌 *Recordatorio:* Rogamos acudir con la documentación del vehículo y la póliza del seguro.\n`;
        }

        mensaje += `\n📍 *Ubicación:* Talleres A.Q.\n` +
                   `Cualquier cambio o duda, responda a este mensaje con antelación.\n\n` +
                   `¡Muchas gracias por su confianza!`;

        return mensaje;
    }

    function updatePreview() {
        const text = generateMessageText();
        document.getElementById('previewText').innerText = text;
    }

    function togglePreviewSheet() {
        const sheet = document.getElementById('previewSheet');
        const backdrop = document.getElementById('previewBackdrop');
        isSheetOpen = !isSheetOpen;

        if (isSheetOpen) {
            sheet.classList.remove('translate-y-full');
            backdrop.classList.remove('opacity-0', 'pointer-events-none');
        } else {
            sheet.classList.add('translate-y-full');
            backdrop.classList.add('opacity-0', 'pointer-events-none');
        }
    }

    function copyMessageText() {
        const text = generateMessageText();
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        
        try {
            document.execCommand('copy');
            showToast('¡Mensaje copiado al portapapeles!', 'success');
        } catch (err) {
            showToast('No se pudo copiar el texto', 'error');
        }
        document.body.removeChild(textArea);
    }

    function sendWhatsAppMessage() {
        let phoneInput = document.getElementById('telefonoWhatsapp').value.replace(/\D/g, '');
        const prefijo = document.getElementById('prefijoPais').value;

        if (!phoneInput) {
            showToast('Escriba el número de teléfono del cliente', 'error');
            document.getElementById('telefonoWhatsapp').focus();
            return;
        }

        // Automatic +34 formatting for 9-digit local numbers
        let fullPhone = phoneInput;
        if (fullPhone.length === 9 && !fullPhone.startsWith(prefijo)) {
            fullPhone = prefijo + fullPhone;
        } else if (!fullPhone.startsWith(prefijo)) {
            if (fullPhone.startsWith('0')) fullPhone = fullPhone.substring(1);
            fullPhone = prefijo + fullPhone;
        }

        const message = generateMessageText();
        const encodedMessage = encodeURIComponent(message);
        const url = `https://api.whatsapp.com/send?phone=${fullPhone}&text=${encodedMessage}`;

        window.open(url, '_blank');
        showToast('Abriendo WhatsApp...', 'success');
    }

    function resetForm() {
        document.getElementById('formCita').reset();
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('fechaCita').value = today;
        document.getElementById('horaCita').value = '09:00';
        selectService('REVISIÓN / MANTENIMIENTO', document.querySelectorAll('.service-chip')[0]);
        showToast('Formulario reiniciado', 'success');
    }

    function showToast(msg, type) {
        const toast = document.getElementById('toastMessage');
        toast.innerText = msg;
        toast.className = `fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl text-xs font-bold text-white shadow-xl transition-all duration-300 ${
            type === 'success' ? 'bg-emerald-600' : 'bg-aqRed'
        }`;

        setTimeout(() => {
            toast.classList.add('opacity-0', 'pointer-events-none');
        }, 2500);
    }
</script>
</body>
</html>
